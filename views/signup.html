<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Create a ScholarHub student account."><title>Create account | ScholarHub</title><link rel="stylesheet" href="/css/style.css">
<style>
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.auth-aside{padding:8%;background:linear-gradient(145deg,#2448c7,#6d84f4);color:#fff;display:flex;flex-direction:column;justify-content:center}.auth-aside h1{font-size:clamp(30px,4vw,48px);line-height:1.1;margin:20px 0}.auth-aside p{line-height:1.8;color:#e4eaff;max-width:460px}.auth-brand{font-weight:800;font-size:22px}.auth-main{display:grid;place-items:center;padding:28px}.auth-card{width:min(100%,450px)}.auth-card h2{font-size:29px;margin:0 0 8px}.auth-card>p{color:#718096;font-size:13px;line-height:1.6;margin-bottom:18px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field select{width:100%;border:1px solid #dfe5ef;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#172033}.field input:focus,.field select:focus{outline:2px solid #c8d4ff;border-color:#315bea}.auth-submit{width:100%;border:0;border-radius:10px;padding:14px;background:#315bea;color:#fff;font-weight:700;margin-top:12px}.auth-submit:disabled{opacity:.6;cursor:wait}.auth-message{font-size:13px;padding:11px;border-radius:9px;display:none;margin:12px 0}.auth-message.show{display:block}.auth-message.error{background:#fff0f0;color:#a72e36}.auth-message.success{background:#eaf9f0;color:#17643b}.auth-foot{font-size:13px;text-align:center;margin-top:18px}.auth-foot a{color:#315bea;font-weight:700;text-decoration:none}@media(max-width:760px){.auth-wrap{grid-template-columns:1fr}.auth-aside{padding:24px;min-height:180px}.auth-aside h1{font-size:29px;margin:10px 0}.auth-aside p{margin-bottom:0}.auth-main{padding:26px 20px}}
</style></head><body><div class="auth-wrap"><aside class="auth-aside"><div class="auth-brand">🎓 ScholarHub</div><h1>Make your study time count.</h1><p>Create your student account to keep your academic profile, units and revision resources together.</p></aside>
<main class="auth-main"><form class="auth-card" id="signupForm"><p class="eyebrow">JOIN SCHOLARHUB</p><h2>Create your account</h2><p>Enter your student details below to get started.</p><div class="auth-message" id="message" role="status" aria-live="polite"></div>
<div class="field"><label for="fullName">Full names</label><input id="fullName" name="fullName" autocomplete="name" required maxlength="120" placeholder="Your full name"></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
<div class="field"><label for="course">Course enrolled</label><input id="course" name="course" required maxlength="160" placeholder="e.g. Bachelor of Education Science"></div>
<div class="field"><label for="yearOfStudy">Year of study</label><select id="yearOfStudy" name="yearOfStudy" required><option value="">Select your year</option><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option><option>Year 5</option><option>Year 6</option></select></div>
<div class="field"><label for="password">Password (at least 8 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Create a strong password"></div>
<button class="auth-submit" type="submit">Create account →</button><div class="auth-foot">Already registered? <a href="/login">Log in</a></div></form></main></div>
<script>
const form=document.getElementById('signupForm'),message=document.getElementById('message'),submit=form.querySelector('button');
form.addEventListener('submit',async e=>{e.preventDefault();message.className='auth-message';message.textContent='';submit.disabled=true;submit.textContent='Creating account…';
try{const payload={fullName:form.fullName.value.trim(),email:form.email.value.trim(),course:form.course.value.trim(),yearOfStudy:form.yearOfStudy.value,password:form.password.value};const response=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not create account.');if(data.session)sessionStorage.setItem('scholarhub_session',JSON.stringify(data.session));if(data.user)sessionStorage.setItem('scholarhub_user',JSON.stringify(data.user));message.textContent=data.message||'Account created. Check your email if confirmation is required.';message.className='auth-message show success';if(data.session)setTimeout(()=>window.location.assign('/dashboard'),700);else{submit.textContent='Account created';}}
catch(err){message.textContent=err.message;message.className='auth-message show error';submit.disabled=false;submit.textContent='Create account →';}});
</script></body></html>
